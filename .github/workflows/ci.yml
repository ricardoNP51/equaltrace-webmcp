name: Quality gate

on:
  push:
    branches: [main, codex/phase6-continuation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run fail-fast quality gate
        run: npm run check
        env:
          VITE_RELEASE_COMMIT: ${{ github.sha }}
      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: equaltrace-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
