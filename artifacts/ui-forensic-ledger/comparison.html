<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EqualTrace design comparison</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: white;
        background: #20242a;
        font: 600 14px system-ui;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 16px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        height: 36px;
        padding: 8px 10px;
        background: #11151a;
        letter-spacing: 0.08em;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        background: white;
      }
    </style>
  </head>
  <body>
    <main class="grid">
      <figure>
        <figcaption>SELECTED REFERENCE</figcaption>
        <img
          src="selected-reference.png"
          alt="Selected Forensic Ledger design reference"
        />
      </figure>
      <figure>
        <figcaption>IMPLEMENTATION · FINAL QA</figcaption>
        <img
          src="11-final-preview-1440x1024.jpg"
          alt="EqualTrace implementation at 1440 by 1024"
        />
      </figure>
    </main>
  </body>
</html>
